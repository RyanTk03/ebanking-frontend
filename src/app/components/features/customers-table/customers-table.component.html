<div class="table-wrapper">
  <div class="table-header">
    <div class="header-left">
      <h2 class="table-title">Customers</h2>
      <span class="badge">{{ customers()?.length }}</span>
    </div>
  </div>

  <table class="customers-table">
    <thead>
      <tr>
        <th class="sortable">
          ID
        </th>
        <th class="sortable">
          Nom
        </th>
        <th class="sortable">
          Email
        </th>
        <th>
          Actions
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of customers(); let i = index"
          class="table-row"
          [style.animation-delay]="i * 60 + 'ms'">
        <td class="id-cell">
          <span class="id-badge">#{{ customer.id }}</span>
        </td>
        <td class="name-cell">
          {{ customer.name }}
        </td>
        <td class="email-cell">
          {{ customer.email }}
        </td>
        <td class="actions-cell">
          <button class="btn-accounts" (click)="onViewAccounts(customer)" title="Voir les comptes">
            <svg viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2.5 13c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Comptes
          </button>
          <button class="btn-delete" (click)="onDelete(customer)" title="Supprimer">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M3 4h10M6 4V3h4v1M5 4v8h6V4H5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </td>
      </tr>
      <tr *ngIf="customers.length === 0">
        <td colspan="4" class="empty-state">
          <span>Aucun client trouvé</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
